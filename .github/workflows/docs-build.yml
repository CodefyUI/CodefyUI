name: Docs Build

# Build the Docusaurus site (docs/) on every pull request (core#399). The
# config sets onBrokenLinks, onBrokenAnchors and onBrokenMarkdownLinks to
# 'throw', so a broken link or anchor fails `pnpm build`, and so does an MDX
# compile error. A pull request that caused one used to pass every check and
# fail only the Docs Deploy run after the merge.
#
# A workflow of its own rather than a `pull_request:` trigger on
# docs-deploy.yml, which would bring three things with it:
#   * docs-deploy.yml's workflow-level `concurrency: pages` group. A newly
#     queued run in that group cancels the older PENDING one, so a pull request
#     build could cancel a main deploy that was waiting its turn.
#   * Its deploy job, which would run for pull requests unless guarded.
#   * Its `pages: write` and `id-token: write` token permissions.
#
# The install and build steps are docs-deploy.yml's build job, copied; change
# the two together. `pnpm build` is `docusaurus build`, which builds every
# locale in docusaurus.config.ts (en and zh-TW) when no --locale is given.
#
# The job also runs docs/scripts/check-locale-parity.mjs and its tests: every
# English page needs a zh-TW twin with the same headings and anchor ids.
on:
  # No path filter on pull_request, so the check reports on every pull request
  # and can be required as it is: a filtered-out workflow never reports, and a
  # required check that never reports leaves the merge button waiting (the same
  # rule as backend-test.yml). The build takes about 35 seconds.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: docusaurus build (en + zh-TW)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          # Matches the pnpm major that generated docs/pnpm-lock.yaml.
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs
        run: pnpm build

      # A build narrowed to one locale (`docusaurus build --locale en`) would
      # pass this job without ever compiling a zh-TW page.
      - name: Verify both locales were built
        working-directory: docs
        run: |
          test -f build/index.html
          test -f build/zh-TW/index.html

      # Every English page has a zh-TW twin with the same headings, levels and
      # anchor ids (core#399). The build cannot see this: a zh-TW page that
      # falls behind its English twin still builds while every link on it
      # resolves. `!cancelled()` runs these after a failed build too, so one
      # run reports both kinds of problem.
      - name: Test the locale parity checker
        if: ${{ !cancelled() }}
        working-directory: docs
        run: pnpm test:scripts

      - name: Check English / zh-TW page parity
        if: ${{ !cancelled() }}
        working-directory: docs
        run: pnpm check:locale-parity
