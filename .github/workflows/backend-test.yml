name: Backend Tests

# Catch:
#   1. Python-version regressions — `pyproject.toml` says `>=3.10` but the
#      install scripts hardcode 3.11. Without this matrix, code that
#      accidentally depends on 3.11+ syntax silently breaks 3.10 users.
#   2. uv.lock drift — a PR that edits `pyproject.toml` without
#      regenerating the lock would otherwise sail through review.
#   3. Test failures introduced in PRs that don't touch the install path
#      (the existing install-check workflow only fires on releases).
#   4. Plugin-SDK drift. `tests/test_plugin_dx.py` guards the scaffold and the
#      vendored copy of the plugin contract, which live outside `backend/` —
#      one more reason the workflow runs on every PR rather than a path subset.
on:
  # No path filter on pull_request: these checks are required by the main
  # branch ruleset, and a filtered-out workflow never reports, which would
  # leave the PR's merge button waiting forever. Every PR runs everything.
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'examples/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'frontend/src/plugins/contract.ts'
      # The zh-TW node catalog is a BACKEND test fixture: test_api_nodes.py's
      # translation ratchet and test_causal_lm_model_node.py both read
      # frontend/src/i18n/nodeLocales/zh-TW.ts off disk. Editing it with no
      # backend file touched would otherwise skip the very checks that guard
      # it. (Same class of gap as examples/** in frontend-build.yml.)
      - 'frontend/src/i18n/**'
      - 'ruff.toml'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Cover the supported floor (3.10 per pyproject), the install-script
        # default (3.11), and the most recent stable Python so we surface
        # forward-compatibility issues early.
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Verify uv.lock is in sync with pyproject.toml
        working-directory: backend
        run: uv lock --check

      - name: Create venv and install backend (with [dev] extra)
        working-directory: backend
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: pytest
        working-directory: backend
        run: |
          .venv/bin/python -m pytest tests/ -q

      - name: Smoke-import backend (catches syntax errors at import time)
        working-directory: backend
        run: |
          .venv/bin/python -c "from app.main import app; print('FastAPI app:', app.title)"

  # ── Windows (core#245 item 4, core#258) ──────────────────────────────────
  #
  # The matrix above covers VERSIONS, not PLATFORMS, and some of what this
  # repository has been bitten by is only reachable on Windows: `os.execv`
  # orphaning a child (see `_reexec()` in dev.py), file locking, path
  # separators -- and the standard library's own `nt` / `posix` split, which
  # the plugin security gate reasons about directly.
  #
  # core#258 is the concrete case, and it is why this job exists at all.
  # `Lib/ntpath.py` does `try: from nt import _path_exists as exists /
  # except ImportError:`. `nt` is Windows-only, so on ubuntu that import
  # ALWAYS fails and the Python fallback is ALWAYS used. No Python version
  # added to an ubuntu-only matrix can ever surface the difference -- only a
  # different runner can.
  #
  # 3.12 rather than 3.11, deliberately:
  #   * 3.12 is where CPython moved exists/isdir/isfile/islink to `nt` C
  #     fast paths, so it is the lowest version in the matrix on which
  #     Windows and Linux stdlib behaviour actually diverge. A Windows 3.11
  #     job would have been blind to core#258.
  #   * Windows + 3.11 is not uncovered: `install.ps1` pins 3.11 and
  #     `install-check.yml` already runs it on windows-latest.
  #   * It is the newest version in the matrix, so it doubles as the
  #     forward-compatibility signal on the platform most students use.
  # One version on purpose: the full 3-version cross-product would triple CI
  # time for signal that is about the platform, not the version.
  test-windows:
    name: pytest (Windows, Python 3.12)
    runs-on: windows-latest
    # Windows runners are slower than ubuntu and the torch wheel is large;
    # the ubuntu job's 20 minutes is not enough headroom here.
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    # ── 0xc000001d on Emerald Rapids runners (core#373) ────────────────────
    #
    # Seven of the 105 Windows job attempts between 2026-08-11 and 2026-08-29
    # died with `Windows fatal exception: code 0xc000001d`
    # (STATUS_ILLEGAL_INSTRUCTION) -- about one attempt in fifteen, on the same
    # resolved wheel (torch==2.13.0), and twice on the same commit, since one
    # re-run crashed as well. Every one has the same top frames: torch's
    # `linear.py:134 in forward` called from `causal_lm_model_node.py` at the
    # fused QKV projection. The only bfloat16 work in that test file is
    # `test_the_forward_survives_bf16_autocast`, so what dies is a CPU bf16
    # GEMM. The ubuntu jobs have never seen it.
    #
    # Some `windows-2025` VMs land on Intel Xeon Platinum 8573C (Emerald
    # Rapids) hosts that advertise AMX in CPUID leaf 7 and in XCR0 while
    # reporting the tile palettes in CPUID leaf 0x1D as all zeros. oneDNN
    # decides `mayiuse(amx_tile)` from leaf 7 and XCR0, emits an AMX tile
    # kernel for the bf16 GEMM, and the CPU answers with #UD. torch 2.13.0
    # bundles oneDNN v3.12 (third_party/ideep -> mkl-dnn 80afa71, which is tag
    # v3.12) and that version has no palette check. Upstream:
    #   * actions/runner-images#14483 -- the CPUID misreport itself. Open since
    #     2026-07-30, no ETA.
    #   * uxlfoundation/oneDNN#5689 -- the crash report. PR oneDNN#5801 added
    #     the missing palette check and was closed unmerged.
    #
    # `ONEDNN_MAX_CPU_ISA` is oneDNN's own runtime dispatcher control, tested
    # at the top of `mayiuse()` before any CPUID query. `AVX512_CORE_BF16` is
    # the lowest value that still carries bfloat16 and it sits below every AMX
    # value, so the bf16 GEMM keeps a native AVX-512 path and the AMX kernels
    # leave the dispatch table. Reading the variable is a build-time option
    # (`DNNL_ENABLE_MAX_CPU_ISA`, ON by default in oneDNN) that PyTorch's
    # cmake/Modules/FindMKLDNN.cmake leaves alone, so the released wheel
    # honours it.
    #
    # `ATEN_CPU_CAPABILITY`, the knob core#373 first suggested, does not reach
    # this. It selects among ATen's own vectorised kernels, and the crashing
    # code is JIT-generated inside oneDNN.
    #
    # Job-level so the smoke-import step is covered too. On runners with no AMX
    # -- the AMD Zen and Ice Lake pools -- it changes nothing, because nothing
    # above AVX512_CORE_BF16 was reachable there in the first place.
    #
    # Remove when either side is fixed upstream: actions/runner-images#14483
    # lands, or torch ships a oneDNN carrying oneDNN#5801's palette check.
    env:
      ONEDNN_MAX_CPU_ISA: AVX512_CORE_BF16
    steps:
      - uses: actions/checkout@v6

      # Astral's own action rather than the ubuntu job's `curl | sh`. The
      # PowerShell installer edits the *user* PATH in the registry, which an
      # already-running runner process never sees, so the shell one-liner
      # would need us to guess its install directory and echo that into
      # $GITHUB_PATH. The action does that correctly and is maintained by the
      # same people as the installer.
      - uses: astral-sh/setup-uv@v6

      - name: Verify uv is on PATH
        run: uv --version

      - name: Provision Python 3.12
        run: uv python install 3.12

      - name: Verify uv.lock is in sync with pyproject.toml
        working-directory: backend
        run: uv lock --check

      - name: Create venv and install backend (with [dev] extra)
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # The evidence that the cap above is in effect on the machine that
      # actually ran the job. On an 8573C runner the isa line has to name
      # bfloat16 without naming AMX; on any other runner it records which CPU
      # the job landed on, so the correlation in core#373 stays checkable from
      # a log months from now.
      #
      # oneDNN writes verbose output with printf to STDOUT (v3.12
      # src/common/verbose.cpp), so capturing stdout is enough and no `2>&1`
      # merge is needed -- a Python traceback goes straight to the step log
      # instead. The header is emitted once, at the first primitive execution,
      # as `onednn_verbose,v1,info,cpu,isa:<description>`.
      #
      # The probe does two ops. The bf16 `F.linear` is the operation that
      # crashes. The fp32 conv2d is there because the bf16 one is not enough on
      # its own: ATen only hands a CPU bf16 GEMM to oneDNN on machines whose
      # bf16 support it recognises, so on an AMD runner it stays in ATen's own
      # kernels, oneDNN is never entered and no isa line appears (observed on
      # this job's first green run, an EPYC 7763). A CPU fp32 convolution goes
      # through `mkldnn_convolution` on every machine as long as the shapes
      # clear the heuristics in ATen's `use_mkldnn()` -- batch 2 and a 5x5
      # kernel clear both of its clauses -- so the header prints wherever the
      # job lands.
      #
      # A positive AMX match is the only thing that fails the step. A missing
      # isa line is reported as [WARN] and left alone, so a change in oneDNN's
      # verbose format cannot turn this job red on its own. The trailing
      # `exit 0` is what makes that true: the runner appends
      # `exit $LASTEXITCODE` to every pwsh step, so a probe that died would
      # otherwise decide the step's result. A probe that dies is reported as
      # [WARN] and left for the pytest step below to fail on, which is the same
      # crash under the same conditions.
      - name: Report the runner CPU and the oneDNN ISA actually in effect
        working-directory: backend
        run: |
          $cpu = (Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ' | '
          if (-not $cpu) { $cpu = '<unavailable>' }
          Write-Host "[INFO] CPU: $cpu"
          Write-Host "[INFO] ONEDNN_MAX_CPU_ISA=$env:ONEDNN_MAX_CPU_ISA"
          $probe = 'import torch; print("[INFO] torch", torch.__version__); print("[INFO] mkldnn available:", torch.backends.mkldnn.is_available()); x = torch.randn(256, 512).bfloat16(); w = torch.randn(512, 512).bfloat16(); y = torch.nn.functional.linear(x, w); print("[INFO] bf16 linear ->", tuple(y.shape), y.dtype, "finite:", bool(torch.isfinite(y.float()).all())); c = torch.nn.functional.conv2d(torch.randn(2, 8, 32, 32), torch.randn(8, 8, 5, 5)); print("[INFO] fp32 conv2d ->", tuple(c.shape), c.dtype, "finite:", bool(torch.isfinite(c).all()))'
          $env:ONEDNN_VERBOSE = '1'
          $out = & .venv\Scripts\python.exe -c $probe
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Write-Host "[WARN] the bf16 probe exited with $code; -1073741795 there is 0xc000001d, which would mean the ISA cap did not take effect"
          }
          $isa = @($out | Where-Object { $_ -match 'isa:' })
          if ($isa.Count -eq 0) {
            Write-Host "[WARN] oneDNN printed no isa: line - the bf16 GEMM did not reach oneDNN on this runner, so there is nothing to assert"
          } else {
            $isa | ForEach-Object { Write-Host "[ISA] $_" }
            if ($isa -match 'AMX') {
              Write-Host "[FAIL] oneDNN still dispatches to AMX; ONEDNN_MAX_CPU_ISA did not take effect"
              exit 1
            }
            Write-Host "[OK] oneDNN is capped below AMX on this runner"
          }
          exit 0

      - name: pytest
        working-directory: backend
        run: .venv\Scripts\python.exe -m pytest tests/ -q

      - name: Smoke-import backend (catches syntax errors at import time)
        working-directory: backend
        run: .venv\Scripts\python.exe -c "from app.main import app; print('FastAPI app:', app.title)"

  # ── the suite against a BUILT frontend (core#285) ────────────────────────
  #
  # `backend/app/main.py` registers the SPA catch-all only when
  # `frontend/dist/index.html` exists, and a checkout does not have one. So
  # every job above tests the branch where that route is ABSENT -- which is
  # the branch almost nobody runs. The no-Node release path ships
  # `frontend/dist`, so a real installation is always the other branch, and
  # so is any developer who has run `pnpm build`.
  #
  # core#285 is what that costs: four traversal assertions in
  # `test_api_data_files.py` were deterministically red for anyone with a
  # built frontend and green here, for as long as the catch-all has existed.
  # A whole category of defect -- anything whose behaviour depends on that
  # route existing -- was structurally unreachable, the same shape of gap as
  # core#245 item 4 (platforms) along a different axis (build state).
  #
  # ONE job, not a build step bolted onto the matrix, for two reasons:
  #
  #   * The matrix has to keep testing the OTHER state. `cdui dev` is a
  #     supported configuration and dist-absent is what it runs; if every job
  #     built the frontend, nothing would cover that half and this comment
  #     would be describing the opposite blind spot a year from now.
  #   * Build state is not a function of Python version or platform, so
  #     running it four times buys four copies of one answer -- the argument
  #     the `lint` job below and the Windows job above already make.
  #
  # What it costs: one more ubuntu job, ~4 minutes of billed runner time
  # (checkout + uv + torch install + the full suite), of which the frontend
  # build itself is about 20 seconds -- measured on `frontend-build.yml`,
  # where pnpm/setup-node take 8s, `pnpm install --frozen-lockfile` 1s
  # against a warm store cache and `pnpm build` 10s. Added WALL-CLOCK time is
  # zero: it runs in parallel and finishes well inside the Windows job's
  # ~7 minutes, which is and stays the critical path.
  #
  # 3.11 because `install.ps1` / `install.sh` pin it, so this job is the
  # closest thing in CI to what an installed user actually runs.
  test-with-frontend:
    name: pytest (built frontend, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          # Pinned to the major matching frontend/pnpm-lock.yaml's
          # `lockfileVersion: '9.0'`, same as frontend-build.yml.
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision Python 3.11
        run: uv python install 3.11

      - name: Create venv and install backend (with [dev] extra)
        working-directory: backend
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      # Without this the job could silently decay into a fifth copy of the
      # matrix: a frontend build that produced nothing would leave the SPA
      # routes unregistered, the suite would pass, and the gap core#285 is
      # about would be back with a green tick on top of it.
      - name: Confirm the SPA routes are actually registered
        working-directory: backend
        run: |
          .venv/bin/python -c "
          from app.main import app
          names = {getattr(r, 'name', '') for r in app.routes}
          assert 'spa_fallback' in names, 'no SPA catch-all: this job is testing the wrong branch'
          assert 'assets' in names, 'no /assets mount: this job is testing the wrong branch'
          print('SPA routes registered')
          "

      - name: pytest
        working-directory: backend
        run: .venv/bin/python -m pytest tests/ -q

  # ── ruff (core#245 item 2) ───────────────────────────────────────────────
  #
  # Its own job rather than a step in the matrix: lint is platform- and
  # version-independent, so running it three times would only buy three
  # copies of the same answer.
  #
  # Runs from the REPOSITORY ROOT, not from `backend/`. The config lives in
  # `ruff.toml` at the root because the Python here is not only the backend
  # package -- `scripts/` holds the CLI and `plugins/` and `examples/` hold
  # node code that ships to users, and this workflow's own `paths:` filter
  # already treats all four as one blast radius.
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `uvx` pins the version so a new ruff release cannot turn main red
      # overnight. Bump it deliberately, in a PR that also fixes whatever the
      # new rules find.
      - name: ruff check
        run: uvx ruff@0.14.4 check --output-format=github .
